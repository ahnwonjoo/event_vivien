		<script>
			$(window).scroll(function (e) {
    var tabMenu = $(".tabMenu").offset().top-70;
 	var guide_line = $(".guide").offset().top-167;
	var PJ_scroll = $(window).scrollTop();

	if(PJ_scroll < tabMenu) {
		$('.tabMenu').removeClass('fixed');
	} else if(PJ_scroll > guide_line) {
		$('.tabMenu').removeClass('fixed');
	} else {
		$('.tabMenu').addClass('fixed');
	}
    
    // 핵심 수정 부분: 현재 어느 섹션에도 속하지 않았는지 확인하기 위한 변수
    var isAnySectionActive = false; 

    $(".container > div[class^=section]").each(function(){
        var sectionTop = $(this).offset().top - 149;
        var sectionBottom = $(this).offset().top + $(this).height() - 149;

        if(PJ_scroll > sectionTop && PJ_scroll <= sectionBottom){
            isAnySectionActive = true; // 현재 섹션 영역 안에 있음!
            if(!$(".tabMenu .tabButton[data-target='"+$(this).attr('class')+"']").hasClass('active')){
                $(".tabMenu .tabButton").removeClass('active');
                $(".tabMenu .tabButton[data-target='"+$(this).attr('class')+"']").addClass('active');
            }
        }
    });

    // 모든 섹션 루프를 돌았는데 active된 섹션이 없다면 (위쪽 빈 공간 등) active 제거
    if(!isAnySectionActive) {
        $(".tabMenu .tabButton").removeClass('active');
    }
});

$(".tabButton").click(function(){
    var target_scroll = $("."+$(this).attr('data-target')).offset().top-148;
$('body,html').animate({scrollTop:target_scroll},400);
});
