		<script>
            setInterval(function(){
			var now = new Date(),
				end = new Date('2024-08-19 08:59:59'),
				nt = now.getTime(),
				et = end.getTime(),
				hour = "00",
				min = "00",
				sec = "00",
				timer = document.getElementById("eventTimer");

			if(nt < et){
				sec = parseInt(et - nt) / 1000;
				hour = parseInt(sec / 60 / 60);
				sec = (sec - (hour * 60 * 60));
				min = parseInt(sec / 60);
				sec = parseInt(sec - (min * 60));

				if(hour < 10) hour = "0" + hour;
				if(min < 10) min = "0" + min;
				if(sec < 10) sec = "0" + sec;
			}

			timer.children[0].innerHTML = hour;
			timer.children[1].innerHTML = min;
			timer.children[2].innerHTML = sec;
		}, 1000);
            
$(document).ready(function(){
    var _second = 1000; 
    var _minute = _second * 60; 
    var _hour = _minute * 60; 
    var _day = _hour * 24;

    var temp_target = $("#ptause_timer");
    if(temp_target.length>0 && temp_target.data('enddate')){
        temp_target.append('<span class="d"></span><span class="h"></span><span class="m"></span><span class="s"></span>');
        
        var timer;			
        var end_date = temp_target.data('endDate').replace(/(\s+)|:/g,'-').split('-');
        var temp_date = new Date(end_date[0],(end_date[1]-1),end_date[2],end_date[3],end_date[4]);
        function showRemaining() { 
            var now = new Date(); 
            var distDt = temp_date.getTime() - now.getTime(); 

            if (distDt < 0) { 
                clearInterval(timer); 
                temp_target.find('.d').html('0일'); 
                temp_target.find('.h').html('0시간'); 
                temp_target.find('.m').html('0분'); 
                temp_target.find('.s').html('0초'); 
                return; 
            } 
            var days = Math.floor(distDt / _day); 
            var hours = Math.floor((distDt % _day) / _hour); 
            var minutes = Math.floor((distDt % _hour) / _minute); 
            var seconds = Math.floor((distDt % _minute) / _second); 
            temp_target.find('.d').html(days+'일'); 
            temp_target.find('.h').html(hours+'시간'); 
            temp_target.find('.m').html(minutes+'분'); 
            temp_target.find('.s').html(seconds+'초'); 
            temp_target.removeClass('displaynone');
        }
        timer = setInterval(showRemaining, 1000);
    }
});
