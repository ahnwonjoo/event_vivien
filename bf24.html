	div.tabMenu {
    display: block;
    height: 94px; /* 84px -> 94px (총 10px 여유 공간) */
    background-color: #050610;
}
	div.tabMenu .inner {
		/* .inner는 .content-wrap을 감싸는 컨테이너 역할 */
		width: 100%;
		height: 100%;
		margin: 0 auto;
	}
	div.tabMenu .inner .content-wrap {
		display: flex; /* 버튼을 가로로 배열 */
		width: 70%; /* 전체 .inner 너비 대비 60%만 사용 */
		margin: 0 auto; /* 중앙 정렬 (좌우 20%씩 배경 영역 생성) */
		height: 100%;
	}
	div.tabMenu .inner .content-wrap .tabButton{
        display: inline-block;
        width: 45%;

        border: none;
        color: #B3AEAD;
        text-align: center;
        text-decoration: none;

        font-weight: 500;
        position: relative;
        cursor : pointer;
        /* [제거] border-bottom 관련 속성 모두 제거 */
    }
	/* 두 번째 버튼에 중앙 여백 10% 추가 */
	div.tabMenu .inner .content-wrap .tabButton:nth-child(2) {
		margin-left: 10%; 
	}
	div.tabMenu .inner .content-wrap .tabButton.active{ 
		background:#050610;
		color:#fff;
		text-shadow: 0 0 3px #D2A18B, 0 0 5px #FFAE00;

    /* [새로 추가] active 상태일 때 가상 요소를 이용해 경계선 생성 */
    div.tabMenu .inner .content-wrap .tabButton.active:after {
        content: '';

        width: 100%; 
        background-color: #FFF2A7;
        bottom: 10px; /* 탭 버튼 바닥에서 10px 위로 띄움 */

	/* === 상단 고정 (Fixed) 시 스타일 === */

   		height: 94px;
	}

	<script>
		 $(document).ready(function(){
			// ****************************
			// 타이머 로직 (기존 코드 유지)
			// ****************************
			var _second = 1000; 
			var _minute = _second * 60; 
			var _hour = _minute * 60; 
			var _day = _hour * 24;

			var temp_target = $("#ptause_timer");
			if(temp_target.length>0 && temp_target.data('enddate')){
				temp_target.append('<span class="h"></span><span class="m"></span><span class="s"></span><span class="ss"></span>');
				
				var timer;
				var end_date = temp_target.data('endDate').replace(/(\s+)|:/g,'-').split('-');
				var temp_date = new Date(end_date[0],(end_date[1]-1),end_date[2],end_date[3],end_date[4]);
				function showRemaining() { 
					var now = new Date(); 
					var distDt = temp_date.getTime() - now.getTime(); 

					if (distDt < 0) { 
						clearInterval(timer); 
						temp_target.find('.h').html('0'); 
						temp_target.find('.m').html('0'); 
						temp_target.find('.s').html('0'); 
						temp_target.find('.ss').html('0'); 
						return; 
					} 
					var hours = Math.floor(distDt / _hour); 
					var minutes = Math.floor((distDt % _hour) / _minute); 
					var seconds = Math.floor((distDt % _minute) / _second);
					var microsec = Math.floor((distDt % _second) / 10);  // 0~99 사이로 줄이기
					if (microsec < 10) microsec = '0' + microsec;
					temp_target.find('.h').html(hours); 
					temp_target.find('.m').html(minutes); 
					temp_target.find('.s').html(seconds); 
					temp_target.find('.ss').html(microsec); 
					temp_target.removeClass('displaynone');
				}
				timer = setInterval(showRemaining, 1);
			}
			
			// Swiper 
			var swiper = new Swiper(".pajamaSlide", {
				spaceBetween: 30,
				effect: "fade",
				speed: 800,
				loop: true,
				autoplay: {
					delay: 2500,
					disableOnInteraction: false,
				},
			});
			//부드럽게 이동
			$('a[href^="#"]').click(function(e) {
				var href = $(this).attr('href');
				if (href.length > 1 && $(href).length > 0) {
					e.preventDefault();
					var pos = $(href).offset().top;
					$("html, body").animate({ scrollTop: pos }, 600);
					}
				}); 
			});


		// ****************************
		// 탭 메뉴 및 스크롤 로직 (수정)
		// ****************************
		var lastScrollTop = 0; 
		var isScrolling = false; // 플래그 유지

		function getFixedTopOffset(isMobile, PJ_scroll) {
			if (isMobile) {
				if (PJ_scroll > lastScrollTop) {
					return 40; // 스크롤 DOWN
				} else {
					return 80; // 스크롤 UP
				}
			}
			return 70; // PC
		}

		$(window).scroll(function (e) {
			var PJ_scroll = $(window).scrollTop();
			var $tabMenu = $('.tabMenu');
			var $tabMenuInner = $('.tabMenu .inner');
			
			// --- 1. 스크롤 애니메이션 중지 플래그 확인 ---
			// isScrolling이 true이면, 자동 활성화 로직 및 고정 로직을 실행하지 않고 리턴
			if (isScrolling) {
				lastScrollTop = PJ_scroll;
				return; 
			}
			
			var isMobile = $(window).width() <= 600;
			
			// 동적 top 값 계산
			var fixed_top_offset = getFixedTopOffset(isMobile, PJ_scroll);
			
			// 탭 메뉴 고정 시작 기준점
			var tabMenuStart = $tabMenu.offset().top - fixed_top_offset; 
			
			// 탭 메뉴 고정 해제 기준점: section2 다음 요소 (div.bgColor.bgBk2)
			var stop_point = $(".bgBk2").offset().top - fixed_top_offset; 
			
			lastScrollTop = PJ_scroll;
			
			// === 탭 메뉴 고정/해제 로직 ===
			if(PJ_scroll < tabMenuStart) {
				$tabMenu.removeClass('fixed');
			} 
			else if(PJ_scroll > stop_point) { 
				$tabMenu.removeClass('fixed');
			} 
			else {
				$tabMenu.addClass('fixed');
				$tabMenuInner.css('top', fixed_top_offset + 'px');
			}
			
			// ****************************************
			// 탭 버튼 활성화 로직 (스크롤에 의한 Active 상태 반영)
			// ****************************************
			var tabMenuHeight = $tabMenu.height();
			
			$(".container > div[class^=section]").each(function(){
				var sectionName = $(this).attr('class');
				
				if (sectionName.indexOf('section1') !== -1 || sectionName.indexOf('section2') !== -1) {
					
					var activation_offset = fixed_top_offset + tabMenuHeight; 
					
					if((PJ_scroll > $(this).offset().top - activation_offset) && (PJ_scroll <= $(this).offset().top + $(this).height() - activation_offset)){
						var targetData = sectionName.split(' ')[0];
						var $targetButton = $tabMenu.find(".tabButton[data-target='" + targetData + "']");
						
						if(!$targetButton.hasClass('active')){
							$tabMenu.find(".tabButton").removeClass('active');
							$targetButton.addClass('active');
						}
					}
				}
			});
		});


		// ****************************************
		// 탭 클릭 이벤트 핸들러 (수정: e 인자 추가 및 깜빡임 방지 플래그 사용)
		// ****************************************
		$(".tabButton").click(function(e){
			// e 인자 추가 (버튼 요소이므로 preventDefault 불필요)
			
			// 1. 수동 Active 설정 (즉시 적용)
			$(".tabButton").removeClass('active');
			$(this).addClass('active');

			// 2. 스크롤 이동 목표 위치 계산
			var targetSectionClass = $(this).attr('data-target');
			var $targetSection = $("." + targetSectionClass);
			
			var isMobile = $(window).width() <= 600;
			
			// 클릭 시에는 헤더가 축소된 위치(모바일 40px, PC 70px)를 기준으로 스크롤 목표 설정
			var offset = isMobile ? 40 : 70; 

			var target_scroll = $targetSection.offset().top - offset;
			
			// 3. 스크롤 중 플래그 활성화 (이동 전에 실행)
			isScrolling = true; 
			
			// 4. 애니메이션 실행 및 완료 시 플래그 해제
			$('body,html').animate({scrollTop:target_scroll}, 400, function() {
				// 애니메이션 완료 후 플래그 해제 (스크롤 자동 감지 로직 다시 시작)
				isScrolling = false; 
			});
		});

		</script>
</html>
