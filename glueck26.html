	div.tabMenu .inner .tabButton:before {
    	content:'';
        width:2px;
        height:44px;
        position:absolute;
        top:30px;
        left:-2px;
        background:#ACB7DB;
        display:block;
        z-index:1;

	div.tabMenu .inner .tabButton:first-child:before{display:none;}
	div.tabMenu .inner .tabButton.active:before {display:none;}
	div.tabMenu .inner .tabButton.active + .tabButton:before {display:none;}

		<script>
	$(document).ready(function() {
    // 1. 변수 선언 (충돌 방지를 위해 v_ 접두사 사용)
    var v_isScrolling = false; 

    // 2. 탭 고정 및 활성화 체크 함수 (PC 전용)
    function checkTabStatusPC() {
        if (v_isScrolling) return; // 클릭 이동 중에는 자동 로직 중단

        var PJ_scroll = $(window).scrollTop();
        var $v_tab = $(".tabMenu");
        var $v_inner = $(".tabMenu .inner");
        
        // PC 고정 헤더 높이 수동 설정 (70px)
        var v_headerH = 70; 
        
        // 고정 시작점 계산 (약간의 여유값 -10)
        var stickyStart = $v_tab.offset().top - v_headerH - 10;
        // 고정 해제점 (하단 가이드 영역)
        var stickyEnd = $(".guide").length ? $(".guide").offset().top - v_headerH - 100 : 99999;

        if (PJ_scroll < stickyStart) {
            $v_tab.removeClass('fixed');
            $v_inner.css({'position': '', 'top': '', 'width': '', 'margin-left': '', 'left': ''});
        } else if (PJ_scroll > stickyEnd) {
            $v_tab.removeClass('fixed');
            $v_inner.css({'position': '', 'top': '', 'width': '', 'margin-left': '', 'left': ''});
        } else {
            $v_tab.addClass('fixed');
            $v_inner.css({
                'position': 'fixed',
                'top': v_headerH + 'px',
                'left': '50%',
                'width': '800px',
                'margin-left': '-400px',
                'z-index': '9999',
                'background': '#264587' 
            });
        }

        // 섹션 활성화 (Active)
        $(".container > div[class^=section]").each(function(){
            var v_secTop = $(this).offset().top - (v_headerH + $v_tab.height() + 20);
            if(PJ_scroll >= v_secTop && PJ_scroll < (v_secTop + $(this).height())){
                var v_name = $(this).attr('class').split(' ')[0];
                $(".tabButton").removeClass('active');
                $(".tabButton[data-target='"+v_name+"']").addClass('active');
            }
        });
    }

    // 3. 윈도우 스크롤 이벤트 등록
    $(window).scroll(function() {
        checkTabStatusPC();
    });

    // 4. [PC 핵심] 탭 버튼 클릭 이동 (디프로모션 충돌 방지 및 강제 이동)
    $(".tabButton").unbind('click').bind('click', function(e) {
        e.preventDefault();
        e.stopImmediatePropagation(); // 다른 스크립트 간섭 즉시 차단

        var v_targetClass = $(this).attr('data-target');
        var $v_targetElement = $("." + v_targetClass);

        if ($v_targetElement.length > 0) {
            // 즉시 클릭한 버튼 활성화
            $(".tabButton").removeClass('active');
            $(this).addClass('active');

            // 스크롤 감지 잠금
            v_isScrolling = true;

            var v_moveOffset = 70; // PC 헤더 높이
            var v_tabH = $(".tabMenu").height();
            var v_targetPos = $v_targetElement.offset().top - (v_moveOffset + v_tabH - 2);

            // 네이티브 스크롤로 강제 이동 (애니메이션 씹힘 방지)
            window.scrollTo({
                top: v_targetPos,
                behavior: 'smooth'
            });

            // 이동 완료 후 잠금 해제
            setTimeout(function() {
                v_isScrolling = false;
                checkTabStatusPC();
            }, 800);
        }
    });

    // 5. 페이지 로드 시 즉시 실행 (새로고침 대응)
    setTimeout(function() {
        checkTabStatusPC();
    }, 300);
});
