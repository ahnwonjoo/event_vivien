    	content:'';

        left:-2px;

    }
	div.tabMenu .inner .tabButton.active:before {
    	display:none;
    }

    }

		<script>
		 $(document).ready(function(){
            var _second = 1000; 
            var _minute = _second * 60; 
            var _hour = _minute * 60; 
            var _day = _hour * 24;

            var temp_target = $("#vivi_timer");
            if(temp_target.length>0 && temp_target.data('enddate')){
                temp_target.append('<span class="d"></span><span class="h"></span><span class="m"></span><span class="s"></span><span class="ss"></span>');

                var timer;			
                var end_date = temp_target.data('endDate').replace(/(\s+)|:/g,'-').split('-');
                var temp_date = new Date(end_date[0],(end_date[1]-1),end_date[2],end_date[3],end_date[4]);
                function showRemaining() { 
                    var now = new Date(); 
                    var distDt = temp_date.getTime() - now.getTime(); 

                    if (distDt < 0) { 
                        clearInterval(timer);
                        temp_target.parent().addClass('ended');
                        temp_target.find('.d').html('00'); 
                        temp_target.find('.h').html('00'); 
                        temp_target.find('.m').html('00'); 
                        temp_target.find('.s').html('00'); 
                        return; 
                    } 
                    var days = Math.floor(distDt / _day); 
                    var hours = Math.floor((distDt % _day) / _hour); 
                    var minutes = Math.floor((distDt % _hour) / _minute); 
                    var seconds = Math.floor((distDt % _minute) / _second);
            		var microsec = Math.floor((distDt % _second) / 10);
                    if (days<10) days = '0'+days;
                    if (hours<10) hours = '0'+hours;
                    if (minutes<10) minutes = '0'+minutes;
                    if (seconds<10) seconds = '0'+seconds;
                    //if (microsec<10) microsec = '00'+microsec; else if(microsec<100) microsec = '0'+microsec;
                    if (microsec<10) microsec = '0'+microsec; 
                    temp_target.find('.d').html(days); 
                    temp_target.find('.h').html(hours); 
                    temp_target.find('.m').html(minutes); 
                    temp_target.find('.s').html(seconds);
            		temp_target.find('.ss').html(microsec); 
                }
                timer = setInterval(showRemaining, 10);
            }
