		<script>
			    $(window).load(function(){
					// 쿠폰URL 일괄처리
					$("a.cpdBtn").each(function(){
						var temp_href = $(this).attr('href');
						if(temp_href.indexOf('?')==-1){
							$(this).attr('href', temp_href+'?opener_url='+window.location.href);
						}else{
							$(this).attr('href', temp_href+'&opener_url='+window.location.href);
						}
					});
				});
			
			$(document).ready(function(){
				var _second = 1000; 
				var _minute = _second * 60; 
				var _hour = _minute * 60; 
				var _day = _hour * 24;

				var temp_target = $("#ptause_timer");
				if(temp_target.length>0 && temp_target.data('enddate')){
					temp_target.append('<span class="d"></span><span class="h"></span><span class="m"></span><span class="s"></span>');
					
					var timer;			
					var end_date = temp_target.data('endDate').replace(/(\s+)|:/g,'-').split('-');
					var temp_date = new Date(end_date[0],(end_date[1]-1),end_date[2],end_date[3],end_date[4]);
					function showRemaining() { 
						var now = new Date(); 
						var distDt = temp_date.getTime() - now.getTime(); 

						if (distDt < 0) { 
							clearInterval(timer); 
							temp_target.find('.d').html('0'); 
							temp_target.find('.h').html('0'); 
							temp_target.find('.m').html('0'); 
							temp_target.find('.s').html('0'); 
							return; 
						} 
						var days = Math.floor(distDt / _day); 
						var hours = Math.floor((distDt % _day) / _hour); 
						var minutes = Math.floor((distDt % _hour) / _minute); 
						var seconds = Math.floor((distDt % _minute) / _second); 
						temp_target.find('.d').html(days+''); 
						temp_target.find('.h').html(hours+''); 
						temp_target.find('.m').html(minutes+''); 
						temp_target.find('.s').html(seconds+''); 
						temp_target.removeClass('displaynone');
					}
					timer = setInterval(showRemaining, 1000);
				}
			});
			
			var swiper = new Swiper(".mySwiper", {
			  effect : "fade",
			  scrollbar: {
				el: ".swiper-scrollbar",
			  },
			  speed : 1000,
			  autoplay: {
				delay: 2400,
				disableOnInteraction: false,
			  },
			});
			
			var swiper = new Swiper(".pre-swiper", {
			//loop: true,//
			autoplay: {
				delay: 3300,
				disableOnInteraction: false,
			},
			slidesPerView : '1.25',
			spaceBetween: 26, // 간격 적당히
			centeredSlides: true,
			slidesOffsetBefore : 0,
			slidesOffsetAfter : 10,
		  });
